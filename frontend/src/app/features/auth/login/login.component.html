<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to continue</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          required
          #usernameField="ngModel"
          pattern="^\S+$"
          placeholder="Enter your username"
          class="form-control"
          [class.is-invalid]="usernameField.invalid && (usernameField.dirty || usernameField.touched)"
          [class.is-valid]="usernameField.valid && usernameField.touched"
        />
        <div class="validation-error" *ngIf="usernameField.invalid && (usernameField.dirty || usernameField.touched)">
          <span *ngIf="usernameField.errors?.['required']">Username is required.</span>
          <span *ngIf="usernameField.errors?.['pattern']">Username cannot contain spaces.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          #passwordField="ngModel"
          placeholder="Enter your password"
          class="form-control"
          [class.is-invalid]="passwordField.invalid && (passwordField.dirty || passwordField.touched)"
          [class.is-valid]="passwordField.valid && passwordField.touched"
        />
        <div class="validation-error" *ngIf="passwordField.invalid && (passwordField.dirty || passwordField.touched)">
          <span *ngIf="passwordField.errors?.['required']">Password is required.</span>
        </div>
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || !loginForm.valid"
      >
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Logging in...</span>
      </button>
    </form>

    <div class="register-link">
      <p>New user? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
</div>
